# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: FLAT
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget_flat
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget_flat:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    # Match the public FLAT TOFU defaults as closely as open-unlearning allows.
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 5
    save_strategy: no
    # save_steps: 1.0
  method_args:
    divergence: Total-Variation
    template_weight: 1.0

task_name: ???
