# @package _global_

defaults:
  - override /model: Llama-3.2-3B-Instruct
  - override /trainer: SteerUnlearn
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget_idk
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_handler: "SteeringLlamaForCausalLM"
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
    mode: "init"
    # steering_vector_path: "/home/cnz/project/open-unlearning/vectors/Llama-3.2-1B-Instruct/direction.pt"
    control_type: "mlp_adaptive"
    layer_index: 7
    attn_implementation: 'flash_attention_2'
    torch_dtype: bfloat16

forget_split: forget10
retain_split: retain90
retain_logs_path: null

eval:
  tofu:
    forget_split: ${forget_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    
data:
  anchor: forget
  forget:
    TOFU_QA_forget_idk: 
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    warmup_epochs: 1.0 # custom parameter
    learning_rate: 1e-3
    weight_decay: 0.01
    num_train_epochs: 10
    # save_strategy: steps
    # save_steps: 0.5

task_name: ???
