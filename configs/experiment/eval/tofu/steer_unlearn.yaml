# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /eval: tofu

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

model:
  model_handler: "SteeringLlamaForCausalLM"
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
    load_directory: "saves/unlearn/tofu_Llama-3.2-1B-Instruct_forget10_SteerUnlearn_NPO_layer9/checkpoint-120"
    attn_implementation: "flash_attention_2"
    torch_dtype: "bfloat16"
    output_hidden_states: true
    mode: "load"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}

task_name: ???