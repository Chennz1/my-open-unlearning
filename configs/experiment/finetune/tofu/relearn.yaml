# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: TOFU_relearn10
  - override /eval: tofu

mode: finetune
trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 0.0 # custom parameter
    num_train_epochs: 2
    save_strategy: epoch

task_name: tofu_relearn